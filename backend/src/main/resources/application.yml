spring:
  application:
    name: relay
  main:
    banner-mode: 'off'
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/relay}
    username: ${DB_USERNAME:relay}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: false
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 16KB
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: RELAY_SESSION
        http-only: true
        same-site: lax
        # Local loopback HTTP only; set true when serving through HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  structured:
    format:
      console: ecs
    json:
      exclude: error

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

relay:
  operations:
    # An independent operator token is required before metrics can be read/collected.
    enabled: false

